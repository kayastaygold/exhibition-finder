name: Probe museum sites (temporary)

# 一次性的探測 workflow：檢查中美館、國美館、桃美館、新北美術館四個官網
#   - robots.txt 允不允許抓取
#   - 有沒有 RSS／sitemap／API／開放資料的線索
#   - 展覽列表頁在哪、是不是結構化（能不能穩定解析出標題、展期、圖片）
#
# - 只能手動觸發（workflow_dispatch），沒有排程。
# - 只讀不寫：permissions 只有 contents: read，不會 commit 任何東西，
#   也完全不碰 fetch-sources.mjs／build-events.mjs／events.json 這條正式管線。
# - 每個網站只抓 robots.txt、首頁、幾個列表頁、一個詳細頁，請求之間間隔 1 秒。
# - 探測結束後這個檔案會刪掉。
"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe
        run: |
          cat > probe.mjs <<'EOF'
          const SITES = [
            {
              name: "中美館（臺中市立美術館）",
              origin: "https://www.tcam.museum",
              home: "/zh",
              guesses: ["/zh/exhibitions", "/zh/exhibition", "/zh/exhibitions/current", "/zh/exhibition/current"],
            },
            {
              name: "國美館（國立臺灣美術館）",
              origin: "https://www.ntmofa.gov.tw",
              home: "/",
              guesses: [],
            },
            {
              name: "桃美館（桃園市立美術館）",
              origin: "https://tmofa.tycg.gov.tw",
              home: "/ch",
              guesses: ["/ch/exhibitions/current-exhibitions", "/ch/exhibitions/upcoming-exhibitions", "/ch/exhibitions/past-exhibitions"],
            },
            {
              name: "新北美術館（新北市美術館）",
              origin: "https://ntcart.museum",
              home: "/",
              guesses: ["/CH", "/EN"],
            },
          ];
          const FEED_PATHS = ["/rss", "/rss.xml", "/feed", "/feed.xml", "/sitemap.xml"];
          const MAX_LIST_PAGES = 6;

          const summary = [];
          const say = (s = "") => { console.log(s); summary.push(s); };
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function get(url) {
            await sleep(1000);
            const t0 = Date.now();
            try {
              const res = await fetch(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0 (compatible; exhibition-finder-probe/1.0; +https://github.com/kayastaygold/exhibition-finder)",
                  "Accept-Language": "zh-TW,zh;q=0.9",
                },
                signal: AbortSignal.timeout(40000),
              });
              const text = await res.text();
              return { ok: res.ok, status: res.status, type: res.headers.get("content-type") ?? "", text, finalUrl: res.url, ms: Date.now() - t0 };
            } catch (err) {
              return { ok: false, status: 0, type: "", text: "", error: `${err.name}: ${err.cause?.code ?? err.message}`, ms: Date.now() - t0 };
            }
          }
          const fmt = (r) => r.status ? `HTTP ${r.status}, ${r.type.split(";")[0] || "?"}, ${r.text.length} bytes, ${r.ms}ms${r.finalUrl ? `（最終網址 ${r.finalUrl}）` : ""}` : `連線失敗（${r.error}）, ${r.ms}ms`;

          // ---- robots.txt：只看 User-agent: * 那組，最長符合規則優先 ----
          function parseRobots(text) {
            const groups = [];
            let cur = null, lastWasAgent = false;
            for (const raw of text.split(/\r?\n/)) {
              const line = raw.replace(/#.*/, "").trim();
              const m = line.match(/^([A-Za-z-]+)\s*:\s*(.*)$/);
              if (!m) continue;
              const key = m[1].toLowerCase(), val = m[2].trim();
              if (key === "user-agent") {
                if (!lastWasAgent) { cur = { agents: [], rules: [] }; groups.push(cur); }
                cur.agents.push(val.toLowerCase()); lastWasAgent = true;
              } else {
                lastWasAgent = false;
                if (cur && (key === "allow" || key === "disallow")) cur.rules.push({ allow: key === "allow", path: val });
              }
            }
            return groups.find((g) => g.agents.includes("*"));
          }
          function robotsAllows(group, path) {
            if (!group) return { allowed: true, rule: "（沒有 User-agent: * 規則）" };
            let best = null;
            for (const r of group.rules) {
              if (r.path === "") continue;
              const rx = new RegExp("^" + r.path.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\\\$$/, "$"));
              if (rx.test(path) && (!best || r.path.length > best.path.length || (r.path.length === best.path.length && r.allow))) best = r;
            }
            return best ? { allowed: best.allow, rule: `${best.allow ? "Allow" : "Disallow"}: ${best.path}` } : { allowed: true, rule: "（沒有符合的規則）" };
          }

          // ---- HTML 分析 ----
          const strip = (h) => h.replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim();
          const DATE_RANGE = /(20\d{2}|1\d{2})\s*[./年-]\s*\d{1,2}\s*[./月-]\s*\d{1,2}\s*日?\s*(?:\([^)]*\)|（[^）]*）)?\s*[-–—~～至]\s*(?:(20\d{2}|1\d{2})\s*[./年-]\s*)?\d{1,2}\s*[./月-]\s*\d{1,2}\s*日?/g;

          function anchors(html, base) {
            const out = [];
            for (const m of html.matchAll(/<a\b[^>]*href\s*=\s*["']([^"'#]+)["'][^>]*>([\s\S]*?)<\/a>/gi)) {
              try { out.push({ href: new URL(m[1].replace(/&amp;/g, "&"), base).href, text: strip(m[2]).slice(0, 60) }); } catch {}
            }
            return out;
          }

          function analyzeHtml(html, url) {
            const info = {};
            info.title = (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i) ?? [, ""])[1].trim().slice(0, 80);
            info.feeds = [...html.matchAll(/<link[^>]+type=["']application\/(?:rss|atom)\+xml["'][^>]*>/gi)].map((m) => (m[0].match(/href=["']([^"']+)/) ?? [, "?"])[1]);
            info.jsonld = [...html.matchAll(/<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)].map((m) => (m[1].match(/"@type"\s*:\s*"([^"]+)"/g) ?? []).join(",")).filter(Boolean);
            info.spa = ["__NEXT_DATA__", "__NUXT__", "window.__INITIAL_STATE__", "ng-version", 'id="app"', 'id="root"', "data-reactroot", "_next/static", "/_nuxt/"].filter((k) => html.includes(k));
            info.textLen = strip(html).length;
            info.scripts = (html.match(/<script\b/gi) ?? []).length;
            info.imgs = (html.match(/<img\b/gi) ?? []).length;
            info.ogImage = (html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)/i) ?? [, ""])[1];
            info.ogTitle = (html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)/i) ?? [, ""])[1];
            info.api = [...new Set([...html.matchAll(/["'`]((?:https?:\/\/[^"'`\s]+)?\/(?:api|wp-json|graphql|ajax|Handler|webapi)[^"'`\s]*)["'`]/gi)].map((m) => m[1]))].slice(0, 10);
            const text = strip(html);
            info.dates = [...text.matchAll(DATE_RANGE)].map((m) => {
              const before = text.slice(Math.max(0, m.index - 70), m.index).trim();
              return `${m[0].replace(/\s+/g, "")} ← …${before.slice(-70)}`;
            });
            return info;
          }

          function reportHtml(info, label) {
            say(`      [${label}] <title>：${info.title}`);
            say(`      文字量 ${info.textLen} 字、<script> ${info.scripts} 個、<img> ${info.imgs} 個${info.spa.length ? `、前端框架跡象：${info.spa.join("、")}` : ""}`);
            if (info.feeds.length) say(`      RSS/Atom 連結：${info.feeds.join("、")}`);
            if (info.jsonld.length) say(`      JSON-LD 類型：${info.jsonld.join("｜")}`);
            if (info.ogTitle || info.ogImage) say(`      og:title=${info.ogTitle.slice(0, 60)}｜og:image=${info.ogImage.slice(0, 120)}`);
            if (info.api.length) say(`      HTML 裡出現的 API 路徑：${info.api.join("、")}`);
            say(`      日期區間（HTML 原始碼裡直接看得到的）：${info.dates.length} 個`);
            for (const d of info.dates.slice(0, 6)) say(`        · ${d}`);
          }

          const EXHIBIT_LINK = /exhibit|展覽|展演|current|now-?on|special|展/i;

          for (const site of SITES) {
            say(`\n## ${site.name}：${site.origin}`);

            const robotsRes = await get(`${site.origin}/robots.txt`);
            say(`  robots.txt：${fmt(robotsRes)}`);
            let robots = null;
            if (robotsRes.ok && !/<html/i.test(robotsRes.text.slice(0, 300))) {
              say("  ```");
              for (const l of robotsRes.text.trim().split(/\r?\n/).slice(0, 40)) say(`  ${l}`);
              say("  ```");
              robots = parseRobots(robotsRes.text);
            } else if (robotsRes.ok) say(`  （回的是 HTML，不是 robots.txt）`);

            const homeUrl = site.origin + site.home;
            const home = await get(homeUrl);
            say(`  首頁 ${homeUrl}：${fmt(home)}`);
            if (!home.ok) { say(`  ⚠️ 首頁連不上，跳過這個網站`); continue; }
            reportHtml(analyzeHtml(home.text, homeUrl), "首頁");

            for (const p of FEED_PATHS) {
              const r = await get(site.origin + p);
              const looksXml = r.ok && /<\?xml|<rss|<feed|<urlset|<sitemapindex/i.test(r.text.slice(0, 500));
              say(`  ${p}：${fmt(r)}${looksXml ? " ✅ 是 XML" : ""}`);
              if (looksXml) {
                const locs = [...r.text.matchAll(/<(?:loc|link)>([^<]+)<\/(?:loc|link)>/g)].map((m) => m[1]);
                const ex = locs.filter((u) => EXHIBIT_LINK.test(u));
                say(`      ${locs.length} 個網址，其中跟展覽有關 ${ex.length} 個；例：${ex.slice(0, 5).join("、")}`);
              }
            }

            const host = new URL(home.finalUrl || homeUrl).host;
            const links = anchors(home.text, home.finalUrl || homeUrl).filter((a) => new URL(a.href).host === host);
            const exhibitLinks = [...new Map(links.filter((a) => EXHIBIT_LINK.test(a.href) || EXHIBIT_LINK.test(a.text)).map((a) => [a.href, a])).values()];
            say(`  首頁同網域連結 ${links.length} 個，跟展覽有關 ${exhibitLinks.length} 個：`);
            for (const a of exhibitLinks.slice(0, 15)) say(`    · ${a.text || "(無文字)"} → ${a.href}`);

            const candidates = [...new Set([
              ...site.guesses.map((g) => site.origin + g),
              ...exhibitLinks.filter((a) => /exhibit|展覽/i.test(a.href + a.text) && !/\d{3,}|detail|content/i.test(a.href)).map((a) => a.href),
            ])].slice(0, MAX_LIST_PAGES);

            let detailTried = false;
            for (const url of candidates) {
              const path = new URL(url).pathname + new URL(url).search;
              const rb = robotsAllows(robots, path);
              const r = await get(url);
              say(`  列表頁候選 ${url}`);
              say(`      robots.txt 判定：${rb.allowed ? "✅ 允許" : "⛔ 不允許"}（${rb.rule}）`);
              say(`      ${fmt(r)}`);
              if (!r.ok) continue;
              const info = analyzeHtml(r.text, url);
              reportHtml(info, "列表頁");
              const detail = [...new Map(anchors(r.text, r.finalUrl || url)
                .filter((a) => new URL(a.href).host === host && /exhibit|展覽/i.test(a.href) && /\d{2,}|detail|content|[?&]s=/i.test(a.href))
                .map((a) => [a.href, a])).values()];
              say(`      看起來像展覽詳細頁的連結：${detail.length} 個`);
              for (const a of detail.slice(0, 8)) say(`        · ${a.text || "(無文字)"} → ${a.href}`);
              if (!detailTried && detail.length) {
                detailTried = true;
                const d = detail[0];
                const dr = await get(d.href);
                say(`  詳細頁範例 ${d.href}`);
                say(`      robots.txt 判定：${robotsAllows(robots, new URL(d.href).pathname).allowed ? "✅ 允許" : "⛔ 不允許"}`);
                say(`      ${fmt(dr)}`);
                if (dr.ok) reportHtml(analyzeHtml(dr.text, d.href), "詳細頁");
              }
            }
          }

          if (process.env.GITHUB_STEP_SUMMARY) {
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```\n" + summary.join("\n") + "\n```\n");
          }
          EOF
          node probe.mjs
