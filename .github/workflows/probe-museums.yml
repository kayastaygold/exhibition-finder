name: Probe museum sites (temporary)

# 分支版本：第二輪美術館探測，腳本放在 probes/museums-r2.mjs。
# 只能手動觸發、只讀（contents: read），不碰正式資料管線。
"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe
        run: node probes/museums-r2.mjs
