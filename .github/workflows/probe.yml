name: Probe regional sources (temporary)

# 一次性的探測 workflow：找出桃園／台中／高雄候選資料集的實際 API 端點，抓一次並在
# log 和 Job Summary 回報「連不連得上、筆數、欄位、最新日期、有沒有中美館／高美館」。
#
# - 只能手動觸發（workflow_dispatch），沒有排程。
# - 只讀不寫：permissions 只有 contents: read，不會 commit 任何東西，
#   也完全不碰 fetch-sources.mjs／build-events.mjs／events.json 這條正式管線。
# - 探測結束後這個檔案會刪掉。
#
# 第二輪：第一輪已經從 data.gov.tw 找到端點（見各來源的 urls），這輪直接抓、
# 做比較細的分析；高雄第一輪連線逾時，這輪另外用 curl 做 DNS／連線診斷。
"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Network diagnosis (Kaohsiung)
        run: |
          {
            echo "### 高雄網域連線診斷（runner 對外 IP：$(curl -sS -m 10 https://api.ipify.org || echo ?)）"
            echo '```'
            for host in data.kcg.gov.tw api.kcg.gov.tw khcc.kcg.gov.tw www.kcg.gov.tw; do
              ip=$(getent hosts "$host" | awk '{print $1}' | head -1)
              for scheme in https http; do
                r=$(curl -sS -o /dev/null --connect-timeout 30 -m 60 -w '%{http_code} connect=%{time_connect}s total=%{time_total}s' "$scheme://$host/" 2>&1 | tail -1)
                echo "$host (DNS=${ip:-解析失敗}) $scheme -> $r"
              done
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe
        run: |
          cat > probe.mjs <<'EOF'
          const SOURCES = [
            {
              name: "臺中市政府全球資訊網活動訊息（data.gov.tw/dataset/84940）",
              urls: ["https://newdatacenter.taichung.gov.tw/api/v1/no-auth/resource.download?rid=a013118c-4b64-4a82-9d3e-3e804e16d8b9"],
            },
            {
              name: "高雄市政府文化局-展覽活動（data.gov.tw/dataset/47220）",
              urls: [
                "https://data.kcg.gov.tw/dataset/17487d8c-1b87-49c7-bae0-ef22673bf814/resource/dc4b2ab4-478b-4226-8c33-db7c498a224b/download/exhibitions.csv",
                "http://data.kcg.gov.tw/dataset/17487d8c-1b87-49c7-bae0-ef22673bf814/resource/dc4b2ab4-478b-4226-8c33-db7c498a224b/download/exhibitions.csv",
                "https://data.kcg.gov.tw/api/3/action/package_show?id=exhibitions",
              ],
            },
            {
              name: "臺中市葫蘆墩文化中心活動表（data.gov.tw/dataset/83928）",
              urls: ["https://newdatacenter.taichung.gov.tw/api/v1/no-auth/resource.download?rid=f14debec-6cae-415f-8d54-ab2720bff125"],
            },
          ];

          // 標題／主辦／地點相關欄位才拿來比對美術館，避免內文順帶提到就算命中
          const MUSEUMS = {
            中美館: /中美館|臺中市立美術館|台中市立美術館|Taichung Art Museum/i,
            "綠美圖（中美館＋圖書館總館所在建築）": /綠美圖/,
            國美館: /國美館|國立臺灣美術館|國立台灣美術館/,
            高美館: /高美館|高雄市立美術館|內惟藝術中心|高雄兒童美術館/,
            桃美館: /桃美館|桃園市立美術館|橫山書法藝術館|桃園市兒童美術館/,
          };
          const KEY_FIELD = /title|name|名稱|標題|主辦|mainunit|organizer|location|地點|場地|venue|area|行政區|單位/i;
          const CATEGORY_FIELD = /類型|型態|attribute|分類|Sort|mainunit|主辦單位|area|行政區|locationName|地點|場地|venue/i;

          const now = new Date(Date.now() + 8 * 3600 * 1000);
          const TODAY = now.toISOString().slice(0, 10);
          const summary = [];
          const say = (s = "") => { console.log(s); summary.push(s); };

          async function get(url) {
            const t0 = Date.now();
            try {
              const res = await fetch(url, {
                headers: { "User-Agent": "exhibition-finder-probe", Accept: "*/*" },
                signal: AbortSignal.timeout(60000),
              });
              const text = await res.text();
              return { ok: res.ok, status: res.status, type: res.headers.get("content-type") ?? "", text, ms: Date.now() - t0 };
            } catch (err) {
              return { ok: false, status: 0, text: "", error: `${err.name}: ${err.cause?.code ?? err.message}`, ms: Date.now() - t0 };
            }
          }

          function parseDate(v) {
            if (typeof v !== "string" && typeof v !== "number") return null;
            const s = String(v).trim();
            let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
            m = s.match(/^((?:19|20)\d{2})(\d{2})(\d{2})(?:T?\d{0,6})$/); // 20231021、20231021T090000
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            m = s.match(/^(1\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/); // 民國年
            if (m) return `${Number(m[1]) + 1911}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
            return null;
          }

          function parseCsv(text) {
            const rows = [];
            let row = [], cell = "", q = false;
            text = text.replace(/^﻿/, "");
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              if (q) {
                if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
                else if (c === '"') q = false;
                else cell += c;
              } else if (c === '"') q = true;
              else if (c === ",") { row.push(cell); cell = ""; }
              else if (c === "\n" || c === "\r") {
                if (c === "\r" && text[i + 1] === "\n") i++;
                row.push(cell); rows.push(row); row = []; cell = "";
              } else cell += c;
            }
            if (cell || row.length) { row.push(cell); rows.push(row); }
            const [header, ...body] = rows.filter((r) => r.some((x) => x.trim()));
            return (body ?? []).map((r) => Object.fromEntries(header.map((h, i) => [h.trim(), r[i] ?? ""])));
          }

          function findRecords(data) {
            if (Array.isArray(data)) return data;
            if (data && typeof data === "object") {
              let best = null;
              for (const v of Object.values(data)) {
                const r = findRecords(v);
                if (r && (!best || r.length > best.length)) best = r;
              }
              return best;
            }
            return null;
          }

          function top(counter, n = 12) {
            return [...counter.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(([k, v]) => `${k || "(空)"}×${v}`).join("、");
          }

          function analyze(records) {
            const fields = [...new Set(records.slice(0, 50).flatMap((r) => Object.keys(r)))];
            say(`      欄位（${fields.length}）：${fields.join("、")}`);

            const dateFields = fields.filter((f) => records.filter((r) => parseDate(r[f])).length >= records.length * 0.3);
            for (const f of dateFields) {
              const ds = records.map((r) => parseDate(r[f])).filter(Boolean).sort();
              say(`      📅 ${f}：最早 ${ds[0]}、最新 ${ds.at(-1)}（${ds.length} 筆有值）`);
            }
            const endField = dateFields.find((f) => /end|close|迄|結束/i.test(f));
            const startField = dateFields.find((f) => /start|起|開始/i.test(f));
            if (endField) {
              const active = records.filter((r) => (parseDate(r[endField]) ?? "") >= TODAY);
              say(`      ⏳ 以 ${endField} 判斷，${TODAY} 還沒結束的：${active.length} 筆`);
              if (startField) {
                const recent = records.map((r) => parseDate(r[startField])).filter(Boolean).filter((d) => d >= "2026-01-01").length;
                say(`      🆕 ${startField} 在 2026 年以後的：${recent} 筆`);
              }
            }

            for (const f of fields.filter((f) => CATEGORY_FIELD.test(f))) {
              const c = new Map();
              for (const r of records) { const v = String(r[f] ?? "").slice(0, 40); c.set(v, (c.get(v) ?? 0) + 1); }
              if (c.size <= records.length * 0.8 || c.size <= 15) say(`      📊 ${f}（${c.size} 種）：${top(c)}`);
            }

            const titleKey = fields.find((f) => /title|名稱|標題/i.test(f)) ?? fields[0];
            for (const [name, rx] of Object.entries(MUSEUMS)) {
              const hits = [];
              for (const r of records) {
                const inKey = fields.filter((f) => KEY_FIELD.test(f) && rx.test(String(r[f] ?? "")));
                const inAny = inKey.length ? inKey : fields.filter((f) => rx.test(String(r[f] ?? "")));
                if (inAny.length) hits.push({ r, inKey, inAny });
              }
              const keyHits = hits.filter((h) => h.inKey.length);
              say(`      🏛️ ${name}：標題/主辦/地點命中 ${keyHits.length} 筆，只在內文提到 ${hits.length - keyHits.length} 筆`);
              for (const h of hits.slice(0, 12)) {
                const r = h.r;
                const brief = fields.filter((f) => KEY_FIELD.test(f) || dateFields.includes(f) || CATEGORY_FIELD.test(f))
                  .map((f) => `${f}=${String(r[f] ?? "").slice(0, 40)}`).join(" | ");
                say(`         - [${h.inKey.length ? "欄位" : "內文"}:${h.inAny.join(",")}] ${String(r[titleKey]).slice(0, 60)} :: ${brief}`);
              }
            }
            say(`      第一筆：${JSON.stringify(records[0]).slice(0, 500)}`);
          }

          for (const src of SOURCES) {
            say(`\n## ${src.name}`);
            for (const url of src.urls) {
              const r = await get(url);
              say(`  - ${url}`);
              say(`    ${r.status ? `HTTP ${r.status}, ${r.type}, ${r.text.length} bytes` : `連線失敗（${r.error}）`}, ${r.ms}ms`);
              if (!r.ok) { if (r.text) say(`    回應開頭：${JSON.stringify(r.text.slice(0, 200))}`); continue; }
              let records = null;
              try { records = findRecords(JSON.parse(r.text)); } catch {
                if (/csv/i.test(r.type) || /\.csv(\?|$)/i.test(url)) records = parseCsv(r.text);
              }
              if (!records) { say(`    無法解析，前 300 字：${JSON.stringify(r.text.slice(0, 300))}`); continue; }
              say(`    ✅ ${records.length} 筆`);
              if (records.length && typeof records[0] === "object") analyze(records);
              break; // 一個來源抓到一份就夠
            }
          }

          if (process.env.GITHUB_STEP_SUMMARY) {
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```\n" + summary.join("\n") + "\n```\n");
          }
          EOF
          node probe.mjs
