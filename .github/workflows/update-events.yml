name: Update events.json

# 每週一台灣時間 08:00 自動重新產生 events.json，有變化才 commit 到 main。
#
# 排程時間換算：台灣時間是 UTC+8，所以「台灣時間週一 08:00」= UTC 週一 00:00。
# GitHub Actions 的 cron 只認 UTC，下面 "0 0 * * 1" 就是這個時間點。
#
# 也開放手動觸發（workflow_dispatch），不用等到下週一才能測試這支 workflow。
#
# 流程：fetch-sources.mjs 依 data/sources.json 抓每個 enabled 的來源（目前是文化部、
# 文化快遞、新北市美術館、國美館與中美館官網；北美館 data.taipei 已停用，見 schema.md 8.6、
# 第 11 節；桃美館是人工維護的 override，不抓取，見 11.8）的最新資料寫進各自的
# raw 檔 → build-events.mjs 把 raw 檔＋override 檔轉成 events.json → 有任何變化才
# commit。任一來源抓取失敗時，fetch-sources.mjs 會保留上一次的 raw 檔、印出警告，
# 不會讓整個 workflow 失敗；只有 build 合併出 0 筆時才會失敗、不 commit。
# 見 schema.md 第 9.3 節。
#
# raw 檔也要一起 commit：「抓取失敗就沿用上一次的 raw 檔」的前提是上一次的檔案
# 在 repo 裡——不 commit 的話，下次 runner checkout 下來的永遠是舊快照。

# 這裡刻意把 on 用引號包起來寫成 "on"——不加引號的話，有些 YAML 1.1 剖析器
# （例如 PyYAML 預設模式）會把裸的 on 當成布林值 true 解析（YAML 的經典
# "挪威問題"）。GitHub Actions 自己的剖析器可以正確處理不加引號的 on，但
# 其他工具（lint 工具、編輯器外掛）不一定能，加引號可以完全避開這個疑慮。
"on":
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

# 讓內建的 GITHUB_TOKEN 有權限把 commit push 回這個 repo。
permissions:
  contents: write

# 避免排程跟手動觸發同時各跑一次、互相搶著 push。
concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest source data
        run: node scripts/fetch-sources.mjs

      - name: Build events.json
        run: node scripts/build-events.mjs

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain -- events.json 'data/*-raw.json')" ]; then
            echo "events.json 跟 raw 檔都沒有變化，略過 commit。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json data/*-raw.json
          git status --short
          git commit -m "chore: 每週自動更新展覽資料"
          git push
